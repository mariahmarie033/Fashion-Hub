services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - PORT=5173
      - BASE_PATH=/
      - NODE_ENV=development
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - "3000:5173"
    command:
      - sh
      - -ec
      - |
        npm install -g pnpm@9
        pnpm install --frozen-lockfile
        exec pnpm --filter @workspace/clothing-brand dev
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
